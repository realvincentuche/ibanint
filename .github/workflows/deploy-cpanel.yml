name: Deploy theme to Namecheap

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/ibanint/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: PHP syntax check (fail before touching prod)
        run: |
          for f in $(find wp-content/themes/ibanint -name '*.php'); do
            php -l "$f" || exit 1
          done

      - name: FTP deploy theme folder
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./wp-content/themes/ibanint/
          server-dir: ./wp-content/themes/ibanint/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.DS_Store
            **/node_modules/**
